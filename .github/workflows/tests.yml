name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-neural.txt
      - name: Install complete CPU test dependencies
        run: python -m pip install -r requirements-neural.txt
      - name: Require neural dependency
        run: python -c "import tensorflow; from models import build_model"
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Run NumPy synthetic demo
        run: python run_demo.py
      - name: Run neural synthetic demo
        run: python run_demo.py --neural --epochs 3
